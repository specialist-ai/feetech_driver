[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "feetech-driver"
version = "0.1.0"
description = "Driver and bench tools for Feetech SMS/STS serial-bus servos"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# The wire protocol and the serial transport are in the C++ core, so the Python
# package needs nothing at runtime.
dependencies = []

[project.scripts]
feetech-scan = "feetech_driver.tools.scan:main"
feetech-set-id = "feetech_driver.tools.set_id:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff==0.15.0",
]

[tool.scikit-build]
minimum-version = "1.0"
build-dir = "build/wheel/{wheel_tag}"
wheel.packages = ["python/feetech_driver"]

[tool.scikit-build.cmake.define]
FEETECH_BUILD_PYTHON = "ON"
FEETECH_INSTALL = "OFF"
FEETECH_BUILD_TESTING = "OFF"
FEETECH_BUILD_EXAMPLES = "OFF"

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
